[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/robmeijerink/xaf-auditfile"
homepage = "https://github.com/robmeijerink/xaf-auditfile"
authors = ["Rob Meijerink"]
keywords = ["xaf", "auditfile", "belastingdienst", "vat", "btw"]
categories = ["parser-implementations", "finance"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
